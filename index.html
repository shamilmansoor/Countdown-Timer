<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Countdown Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

:root {
  --bg: #0a0a0f;
  --panel: rgba(255,255,255,0.04);
  --border: rgba(0,255,136,0.15);
  --accent: #00ff88;
  --accent2: #00ccff;
  --warn: #ff6600;
  --danger: #ff2244;
  --dim: #445566;
  --text: #c8d8e8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  font-family: 'Share Tech Mono', monospace;
  color: var(--text);
  transition: background 0.6s;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  padding: clamp(16px, 4vh, 40px) 0;
}

/* Full-screen colour wash */
body.state-active  { background: #001a0d; }
body.state-warn    { background: #1a0800; }
body.state-danger  { background: #1a0008; animation: bg-flash 0.5s ease-in-out infinite; }
body.state-done    { background: #1a0008; }
body.state-countdown { background: #00101a; }

@keyframes bg-flash {
  0%,100% { background: #1a0008; }
  50%     { background: #2a0010; }
}

/* Grid overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Scan line */
body::after {
  content: '';
  position: fixed; top: -100%; left: 0; right: 0; height: 200px;
  background: linear-gradient(transparent, rgba(0,255,136,0.04), transparent);
  animation: scan 6s linear infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes scan { to { top: 100%; } }

/* Vignette glow that matches state */
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  transition: opacity 0.6s;
  opacity: 0;
  box-shadow: inset 0 0 120px rgba(0,255,136,0.08);
}
body.state-active  .vignette { opacity: 1; box-shadow: inset 0 0 160px rgba(0,255,136,0.12); }
body.state-warn    .vignette { opacity: 1; box-shadow: inset 0 0 160px rgba(255,102,0,0.14); }
body.state-danger  .vignette { opacity: 1; box-shadow: inset 0 0 180px rgba(255,34,68,0.2); animation: vig-pulse 0.5s ease-in-out infinite; }
body.state-done    .vignette { opacity: 1; box-shadow: inset 0 0 200px rgba(255,34,68,0.3); }
body.state-countdown .vignette { opacity: 1; box-shadow: inset 0 0 160px rgba(0,204,255,0.12); }
@keyframes vig-pulse {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.5; }
}

/* Layout */
.shell {
  position: relative; z-index: 1;
  width: min(520px, 96vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2.5vh, 22px);
  padding: 0 clamp(10px, 3vw, 20px);
  margin: auto;
}

.page-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(9px, 2vw, 11px);
  font-weight: 700;
  letter-spacing: 8px;
  color: var(--dim);
  text-transform: uppercase;
}

/* ── TIMER CARD ── */
.timer-card {
  width: 100%;
  min-height: clamp(100px, 22vw, 160px);
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: clamp(16px, 4vw, 36px) clamp(10px, 4vw, 32px) clamp(14px, 3vw, 26px);
  text-align: center;
  backdrop-filter: blur(10px);
  transition: border-color 0.4s, box-shadow 0.4s;
  overflow: hidden;
}

/* corner brackets */
.timer-card::before, .timer-card::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border-style: solid;
  border-color: var(--accent);
  transition: border-color 0.4s;
}
.timer-card::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.timer-card::after  { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

body.state-active  .timer-card { border-color: rgba(0,255,136,0.35); box-shadow: 0 0 40px rgba(0,255,136,0.12); }
body.state-warn    .timer-card { border-color: rgba(255,102,0,0.45); box-shadow: 0 0 40px rgba(255,102,0,0.15); }
body.state-danger  .timer-card { border-color: rgba(255,34,68,0.55); box-shadow: 0 0 60px rgba(255,34,68,0.2); }
body.state-done    .timer-card { border-color: rgba(255,34,68,0.6);  box-shadow: 0 0 80px rgba(255,34,68,0.25); }
body.state-countdown .timer-card { border-color: rgba(0,204,255,0.4); box-shadow: 0 0 40px rgba(0,204,255,0.12); }

body.state-active  .timer-card::before,
body.state-active  .timer-card::after { border-color: var(--accent); }
body.state-warn    .timer-card::before,
body.state-warn    .timer-card::after { border-color: var(--warn); }
body.state-danger  .timer-card::before,
body.state-danger  .timer-card::after { border-color: var(--danger); }
body.state-countdown .timer-card::before,
body.state-countdown .timer-card::after { border-color: var(--accent2); }

/* Countdown overlay inside card */
.cd-overlay {
  display: none;
  position: absolute; inset: 0;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 5;
  overflow: hidden;
}
.cd-overlay.show { display: flex; }
.cd-number {
  font-family: 'Orbitron', sans-serif;
  /* Scale relative to the card itself, not the viewport */
  font-size: clamp(32px, 10vw, 72px);
  font-weight: 900;
  color: var(--accent2);
  text-shadow: 0 0 30px rgba(0,204,255,0.7), 0 0 60px rgba(0,204,255,0.3);
  animation: cd-pop 1s ease-out forwards;
  line-height: 1;
  max-width: 100%;
}
.cd-label {
  font-size: clamp(8px, 1.6vw, 10px);
  letter-spacing: 5px;
  color: var(--accent2);
  text-transform: uppercase;
  opacity: 0.65;
}
@keyframes cd-pop {
  0%   { transform: scale(1.3); opacity: 0; }
  25%  { transform: scale(1);   opacity: 1; }
  75%  { transform: scale(1);   opacity: 1; }
  100% { transform: scale(0.85); opacity: 0; }
}

/* Time display */
.time-text {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 48px;
  letter-spacing: 0;
  line-height: 1.1;
  color: var(--accent);
  text-shadow: 0 0 24px rgba(0,255,136,0.4);
  transition: color 0.3s, text-shadow 0.3s;
  user-select: none;
  white-space: nowrap;
  display: block;
  max-width: 100%;
}
body.state-warn   .time-text { color: var(--warn);   text-shadow: 0 0 30px rgba(255,102,0,0.5); }
body.state-danger .time-text { color: var(--danger);  text-shadow: 0 0 40px rgba(255,34,68,0.6); animation: pulse-txt 0.5s ease-in-out infinite; }
body.state-done   .time-text { color: var(--danger);  text-shadow: 0 0 40px rgba(255,34,68,0.6); }
body.state-countdown .time-text { color: var(--dim); text-shadow: none; }
@keyframes pulse-txt { 0%,100%{opacity:1} 50%{opacity:0.6} }

.status-bar {
  font-size: clamp(8px, 1.8vw, 10px);
  letter-spacing: 4px;
  color: var(--dim);
  margin-top: 10px;
  text-transform: uppercase;
  height: 14px;
  transition: color 0.3s;
}
body.state-active    .status-bar { color: var(--accent); }
body.state-warn      .status-bar { color: var(--warn); }
body.state-danger    .status-bar { color: var(--danger); }
body.state-done      .status-bar { color: var(--danger); }
body.state-countdown .status-bar { color: var(--accent2); }

.progress-wrap {
  width: 100%; height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px; overflow: hidden;
  margin-top: clamp(14px, 3vw, 22px);
}
.progress-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 2px;
  transition: width 1s linear, background 0.5s;
  box-shadow: 0 0 8px var(--accent);
}
body.state-warn   .progress-bar { background: linear-gradient(90deg,#ff4400,var(--warn)); box-shadow: 0 0 8px var(--warn); }
body.state-danger .progress-bar { background: linear-gradient(90deg,#ff0022,var(--danger)); box-shadow: 0 0 8px var(--danger); }

/* ── INPUT PANEL ── */
.input-section {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: clamp(14px, 3vw, 22px) clamp(12px, 4vw, 24px);
  backdrop-filter: blur(10px);
}
.input-label {
  font-size: clamp(8px, 1.8vw, 9px);
  letter-spacing: 4px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: clamp(10px, 2.5vw, 16px);
  display: block;
  text-align: center;
}
.time-inputs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 2vw, 10px);
}
.time-unit {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px;
}
.time-unit label {
  font-size: clamp(7px, 1.5vw, 9px);
  letter-spacing: 3px; color: var(--dim);
  text-transform: uppercase;
}
.time-unit input {
  width: clamp(52px, 16vw, 76px);
  text-align: center;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(0,255,136,0.2);
  color: var(--accent);
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(20px, 6vw, 30px);
  font-weight: 700;
  padding: clamp(6px, 2vw, 10px) 2px;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.time-unit input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(0,255,136,0.2);
}
.time-unit input::-webkit-inner-spin-button,
.time-unit input::-webkit-outer-spin-button { -webkit-appearance: none; }

.colon {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(20px, 6vw, 30px);
  font-weight: 900;
  color: var(--dim);
  margin-bottom: clamp(14px, 3vw, 20px);
}

/* ── OPTIONS PANEL ── */
.options-section {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: clamp(12px, 3vw, 18px) clamp(12px, 4vw, 22px);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.options-title {
  font-size: clamp(8px, 1.8vw, 9px);
  letter-spacing: 4px;
  color: var(--dim);
  text-transform: uppercase;
  display: block;
}
.opt-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.opt-row .cooldown-area {
  width: 100%;
  min-width: 0;
}
.opt-row label {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; flex: 1;
}
.opt-row label span {
  font-size: clamp(9px, 2vw, 11px);
  letter-spacing: 2px;
  color: var(--text);
  text-transform: uppercase;
}

/* toggle switch */
.toggle {
  position: relative; width: 36px; height: 20px; flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--dim);
  border-radius: 20px;
  cursor: pointer;
  transition: background 0.3s, border-color 0.3s;
}
.toggle-track::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--dim);
  top: 3px; left: 3px;
  transition: transform 0.3s, background 0.3s;
}
.toggle input:checked + .toggle-track {
  background: rgba(0,255,136,0.15);
  border-color: var(--accent);
}
.toggle input:checked + .toggle-track::after {
  transform: translateX(16px);
  background: var(--accent);
}

/* cooldown slider area */
.cooldown-area {
  display: flex; align-items: center; gap: 10px;
  flex: 1; min-width: 160px;
  opacity: 0.3;
  pointer-events: none;
  transition: opacity 0.3s;
}
.cooldown-area.enabled { opacity: 1; pointer-events: auto; }
.cooldown-area span {
  font-size: clamp(8px, 1.8vw, 10px);
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  white-space: nowrap;
}
.cooldown-area .cd-val {
  color: var(--accent2);
  font-family: 'Orbitron', sans-serif;
  min-width: 24px;
  text-align: right;
}
input[type=range].cd-slider {
  -webkit-appearance: none;
  flex: 1; height: 2px;
  background: rgba(0,204,255,0.2);
  border-radius: 2px; outline: none;
}
input[type=range].cd-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--accent2);
  box-shadow: 0 0 6px rgba(0,204,255,0.5);
  cursor: pointer;
}

/* ── CONTROLS ── */
.controls {
  display: flex;
  gap: clamp(6px, 2vw, 12px);
  width: 100%;
}
.btn {
  flex: 1;
  padding: clamp(10px, 2.5vw, 14px) 4px;
  border: 1px solid;
  border-radius: 4px;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(8px, 2vw, 10px);
  font-weight: 700;
  letter-spacing: clamp(1px, 1vw, 4px);
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: currentColor; opacity: 0; transition: opacity 0.2s;
}
.btn:hover::after { opacity: 0.08; }
.btn:active::after { opacity: 0.15; }
.btn:active { transform: scale(0.97); }

.btn-start { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(0,255,136,0.1); }
.btn-start:hover { box-shadow: 0 0 20px rgba(0,255,136,0.25); }
.btn-pause { border-color: var(--accent2); color: var(--accent2); }
.btn-reset { border-color: var(--dim); color: var(--dim); }
.btn-reset:hover { border-color: var(--text); color: var(--text); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; transform: none; }

/* ── BOTTOM ROW ── */
.bottom-row {
  display: flex; align-items: center;
  justify-content: space-between;
  width: 100%;
}
.vol-row { display: flex; align-items: center; gap: 10px; flex: 1; width: 100%; }
.vol-label { font-size: clamp(8px,1.8vw,9px); letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
input[type=range].vol-slider {
  -webkit-appearance: none;
  width: clamp(70px, 18vw, 110px); height: 2px;
  background: var(--border); border-radius: 2px; outline: none;
}
input[type=range].vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--accent); cursor: pointer;
}

/* ── Hide sections when running ── */
.input-section,
.options-section,
.bottom-row {
  transition: opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease;
  max-height: 500px;
  overflow: hidden;
}
.sections-hidden .input-section,
.sections-hidden .options-section,
.sections-hidden .bottom-row {
  opacity: 0;
  pointer-events: none;
  max-height: 0;
  transform: translateY(-8px);
  margin-top: 0;
  margin-bottom: 0;
  padding-top: 0;
  padding-bottom: 0;
}

/* flash overlay */
.alert-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(255,34,68,0.1);
  animation: alert-flash 0.35s ease-in-out infinite;
  pointer-events: none; z-index: 100;
}
.alert-overlay.show { display: block; }
@keyframes alert-flash { 0%,100%{opacity:0} 50%{opacity:1} }

/* ── RESPONSIVE ── */

/* Cooldown row: stack vertically on narrow screens */
@media (max-width: 420px) {
  .opt-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .cooldown-area {
    width: 100%;
    min-width: 0;
  }

  /* Bottom row: stack volume control */
  .bottom-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .vol-row {
    width: 100%;
  }
  input[type=range].vol-slider {
    flex: 1;
    width: auto;
  }

  /* Make shell full-width with tighter padding on tiny screens */
  .shell {
    width: 100%;
    padding: 0 clamp(8px, 4vw, 16px);
  }

  /* Ensure input fields don't overflow */
  .time-inputs {
    gap: clamp(2px, 1vw, 6px);
  }
  .time-unit input {
    width: clamp(56px, 24vw, 76px);
  }
  .colon {
    font-size: clamp(18px, 5vw, 26px);
  }

  /* Prevent button text overflow */
  .btn {
    font-size: clamp(7px, 2.2vw, 10px);
    letter-spacing: 1px;
    padding: clamp(10px, 2.5vw, 14px) 2px;
  }
}

/* Landscape phones: reduce vertical gaps */
@media (max-height: 500px) and (orientation: landscape) {
  body {
    padding: 10px 0;
  }
  .shell {
    gap: clamp(6px, 1.5vh, 12px);
  }
  .timer-card {
    min-height: clamp(70px, 16vw, 110px);
    padding: clamp(10px, 2vw, 18px) clamp(10px, 4vw, 32px);
  }
  .options-section {
    gap: 8px;
  }
  .input-section {
    padding: clamp(8px, 2vw, 14px) clamp(12px, 4vw, 24px);
  }
  .time-unit input {
    padding: clamp(4px, 1.5vw, 8px) 2px;
  }
}
</style>
</head>
<body>

<div class="vignette"></div>
<div class="alert-overlay" id="alertOverlay"></div>

<div class="shell">

  <div class="page-title">◈ Countdown Timer</div>

  <!-- TIMER CARD -->
  <div class="timer-card" id="timerCard">
    <!-- Countdown overlay -->
    <div class="cd-overlay" id="cdOverlay">
      <div class="cd-number" id="cdNumber">3</div>
      <div class="cd-label">Starting in…</div>
    </div>

    <div class="time-text" id="timeText">00:00:00</div>
    <div class="status-bar" id="statusBar">STANDBY</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-section">
    <span class="input-label">◂ Set Duration ▸</span>
    <div class="time-inputs">
      <div class="time-unit">
        <input type="number" id="inputH" min="0" max="99" value="0">
        <label>HH</label>
      </div>
      <div class="colon">:</div>
      <div class="time-unit">
        <input type="number" id="inputM" min="0" max="59" value="5">
        <label>MM</label>
      </div>
      <div class="colon">:</div>
      <div class="time-unit">
        <input type="number" id="inputS" min="0" max="59" value="0">
        <label>SS</label>
      </div>
    </div>
  </div>

  <!-- OPTIONS -->
  <div class="options-section">
    <span class="options-title">◂ Options ▸</span>

    <!-- Starting buzzer row -->
    <div class="opt-row">
      <label>
        <div class="toggle">
          <input type="checkbox" id="toggleBuzzer" onchange="onToggleBuzzer()">
          <div class="toggle-track"></div>
        </div>
        <span>Starting Buzzer</span>
      </label>
    </div>

    <!-- Cooldown row -->
    <div class="opt-row">
      <label>
        <div class="toggle">
          <input type="checkbox" id="toggleCooldown" onchange="onToggleCooldown()">
          <div class="toggle-track"></div>
        </div>
        <span>Cooldown Before Start</span>
      </label>
      <div class="cooldown-area" id="cooldownArea">
        <span>Delay</span>
        <input type="range" class="cd-slider" id="cdSlider" min="1" max="10" value="3" oninput="updateCdVal()">
        <span class="cd-val" id="cdVal">3s</span>
      </div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="controls">
    <button class="btn btn-start" id="btnStart" onclick="startTimer()">▶ Start</button>
    <button class="btn btn-pause" id="btnPause" onclick="pauseTimer()" disabled>⏸ Pause</button>
    <button class="btn btn-reset" onclick="resetTimer()">↺ Reset</button>
  </div>

  <!-- VOLUME -->
  <div class="bottom-row">
    <div class="vol-row">
      <span class="vol-label">⚡ Volume</span>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="0.8">
    </div>
  </div>

</div>

<script>
/* ── State ── */
let totalSec = 0, remaining = 0;
let running = false, counting = false;
let mainInterval = null, cdTimeout = null;
let audioCtx = null;
let buzzerNodes = [];

/* ── Audio ── */
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playStartBuzzer() {
  const ctx = getAC();
  const vol = +document.getElementById('volSlider').value;
  const mg = ctx.createGain();
  mg.gain.setValueAtTime(vol, ctx.currentTime);
  mg.connect(ctx.destination);
  // Three ascending beeps
  [[440,0],[660,0.22],[880,0.44]].forEach(([f, t]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(f, ctx.currentTime);
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + t + 0.01);
    g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + t + 0.15);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + t + 0.18);
    o.connect(g); g.connect(mg);
    o.start(ctx.currentTime + t);
    o.stop(ctx.currentTime + t + 0.2);
  });
}

function playEndBuzzer() {
  const ctx = getAC();
  const vol = +document.getElementById('volSlider').value;
  buzzerNodes.forEach(n => { try { n.stop(); } catch(e){} });
  buzzerNodes = [];
  const mg = ctx.createGain();
  mg.gain.setValueAtTime(vol, ctx.currentTime);
  mg.connect(ctx.destination);
  [[880,'sawtooth',0.25],[660,'square',0.15],[440,'sawtooth',0.10]].forEach(([f,t,gv]) => {
    for (let i = 0; i < 6; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = t; o.frequency.setValueAtTime(f, ctx.currentTime);
      g.gain.setValueAtTime(0, ctx.currentTime);
      const s = ctx.currentTime + i * 0.28;
      g.gain.linearRampToValueAtTime(gv, s + 0.01);
      g.gain.linearRampToValueAtTime(gv, s + 0.16);
      g.gain.linearRampToValueAtTime(0, s + 0.18);
      o.connect(g); g.connect(mg);
      o.start(s); o.stop(s + 0.2);
      buzzerNodes.push(o);
    }
  });
}

function playTickWarning() {
  const ctx = getAC();
  const vol = +document.getElementById('volSlider').value * 0.22;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(1200, ctx.currentTime);
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.08);
}

function playCdBeep(n) {
  const ctx = getAC();
  const vol = +document.getElementById('volSlider').value * 0.35;
  const freq = n === 0 ? 1100 : 700; // final beep is higher
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq, ctx.currentTime);
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.28);
}

/* ── Helpers ── */
const pad = n => String(n).padStart(2, '0');
const fmt = s => `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;

function setBodyState(s) {
  document.body.className = s ? `state-${s}` : '';
}

function updateUI() {
  document.getElementById('timeText').textContent = fmt(remaining);
  fitTimeText();
  const pct = totalSec > 0 ? (remaining / totalSec) * 100 : 100;
  document.getElementById('progressBar').style.width = pct + '%';

  if (remaining <= 10 && running) {
    document.getElementById('statusBar').textContent = '⚠ CRITICAL';
    setBodyState('danger');
  } else if (totalSec > 0 && remaining / totalSec <= 0.25 && running) {
    document.getElementById('statusBar').textContent = 'WARNING';
    setBodyState('warn');
  } else if (running) {
    document.getElementById('statusBar').textContent = 'RUNNING';
    setBodyState('active');
  }
}

/* ── Cooldown toggle ── */
function onToggleBuzzer() {}
function onToggleCooldown() {
  const on = document.getElementById('toggleCooldown').checked;
  document.getElementById('cooldownArea').classList.toggle('enabled', on);
}
function updateCdVal() {
  document.getElementById('cdVal').textContent = document.getElementById('cdSlider').value + 's';
}

/* ── Countdown sequence ── */
function runCooldown(cb) {
  const delay = parseInt(document.getElementById('cdSlider').value);
  const overlay = document.getElementById('cdOverlay');
  const numEl = document.getElementById('cdNumber');
  let n = delay;

  setBodyState('countdown');
  document.getElementById('statusBar').textContent = 'STARTING IN…';
  counting = true;
  document.querySelector('.shell').classList.add('sections-hidden');
  overlay.classList.add('show');

  function step() {
    numEl.textContent = n;
    // re-trigger animation
    numEl.style.animation = 'none';
    numEl.offsetHeight; // reflow
    numEl.style.animation = '';
    playCdBeep(n);
    if (n <= 0) {
      overlay.classList.remove('show');
      counting = false;
      cb();
      return;
    }
    n--;
    cdTimeout = setTimeout(step, 1000);
  }
  step();
}

/* ── Main timer ── */
function startTimer() {
  if (!running && remaining === 0) {
    const h = parseInt(document.getElementById('inputH').value) || 0;
    const m = parseInt(document.getElementById('inputM').value) || 0;
    const s = parseInt(document.getElementById('inputS').value) || 0;
    totalSec = h * 3600 + m * 60 + s;
    remaining = totalSec;
    if (remaining === 0) return;
  }

  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('alertOverlay').classList.remove('show');

  const doStart = () => {
    if (document.getElementById('toggleBuzzer').checked) playStartBuzzer();
    running = true;
    document.querySelector('.shell').classList.add('sections-hidden');
    setBodyState('active');
    document.getElementById('statusBar').textContent = 'RUNNING';
    mainInterval = setInterval(() => {
      remaining--;
      if (remaining <= 10 && remaining > 0) playTickWarning();
      if (remaining <= 0) {
        remaining = 0;
        clearInterval(mainInterval);
        running = false;
        onDone();
      }
      updateUI();
    }, 1000);
    updateUI();
  };

  const useCooldown = document.getElementById('toggleCooldown').checked;
  if (useCooldown && !running) {
    runCooldown(doStart);
  } else {
    doStart();
  }
}

function pauseTimer() {
  if (!running) return;
  clearInterval(mainInterval);
  running = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusBar').textContent = 'PAUSED';
  setBodyState('');
}

function resetTimer() {
  clearInterval(mainInterval);
  clearTimeout(cdTimeout);
  running = false; counting = false; remaining = 0; totalSec = 0;
  buzzerNodes.forEach(n => { try { n.stop(); } catch(e){} }); buzzerNodes = [];
  document.getElementById('cdOverlay').classList.remove('show');
  document.getElementById('alertOverlay').classList.remove('show');
  document.querySelector('.shell').classList.remove('sections-hidden');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('timeText').textContent = '00:00:00';
  fitTimeText();
  document.getElementById('statusBar').textContent = 'STANDBY';
  document.getElementById('progressBar').style.width = '100%';
  setBodyState('');
}

function onDone() {
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusBar').textContent = "▶▶ TIME'S UP ◀◀";
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('alertOverlay').classList.add('show');
  setBodyState('done');
  playEndBuzzer();
  setTimeout(() => document.getElementById('alertOverlay').classList.remove('show'), 3500);
}

/* ── Input clamp ── */
['inputH','inputM','inputS'].forEach(id => {
  document.getElementById(id).addEventListener('input', function() {
    const max = id === 'inputH' ? 99 : 59;
    if (+this.value > max) this.value = max;
    if (+this.value < 0)  this.value = 0;
  });
});

/* ── Auto-scale time font to always fit card ── */
const _canvas = document.createElement('canvas');
function measureText(text, sizePx) {
  const ctx = _canvas.getContext('2d');
  ctx.font = `900 ${sizePx}px Orbitron, monospace`;
  return ctx.measureText(text).width;
}

function fitTimeText() {
  const el = document.getElementById('timeText');
  const card = document.getElementById('timerCard');
  const style = getComputedStyle(card);
  const padL = parseFloat(style.paddingLeft);
  const padR = parseFloat(style.paddingRight);
  const availW = card.clientWidth - padL - padR - 4; // 4px safety margin

  const text = el.textContent || '00:00:00';
  let lo = 14, hi = 140;
  while (lo < hi - 1) {
    const mid = Math.round((lo + hi) / 2);
    if (measureText(text, mid) <= availW) lo = mid; else hi = mid;
  }
  el.style.fontSize = lo + 'px';
}

window.addEventListener('resize', fitTimeText);
document.fonts ? document.fonts.ready.then(fitTimeText) : setTimeout(fitTimeText, 400);
setTimeout(fitTimeText, 50); // immediate pass before fonts settle
fitTimeText();
</script>
